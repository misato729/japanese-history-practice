# fly.toml app configuration file generated for japanese-history-practice on 2026-10-31T10:07:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'japanese-history-practice'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npm run db:migrate'

[env]
  CORS_ORIGINS = 'https://japanese-history-practice.netlify.app'
  FRONTEND_URL = 'https://japanese-history-practice.netlify.app'

[http_service]
  internal_port = 3000
  force_https = true

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
